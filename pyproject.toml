[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyjab"
dynamic = ["version"]
description = "Python implementation for Java application UI automation with Java Access Bridge"
readme = "README.rst"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gary Gao", email = "gaozhao89@qq.com" },
]
keywords = [
    "java",
    "accessibility",
    "access-bridge",
    "automation",
    "selenium",
    "ui-automation",
    "windows",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    # NOTE: the "License ::" classifier is intentionally absent.  PEP 639 makes
    # the SPDX `license` expression authoritative, and setuptools rejects a
    # build that carries both.  See [project].license above.
    # pyjab drives the Windows Java Access Bridge and imports pywin32, so it is
    # Windows only.  The wheel stays pure-python for historical reasons, which
    # means pip will happily install it on other platforms; pyjab.jabdriver
    # raises a clear error at import time in that case.
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Java Libraries",
    "Topic :: Software Development :: Testing",
    "Topic :: Utilities",
]

# pywin32 is only available (and only needed) on Windows.  The environment
# marker keeps `pip install pyjab` from attempting to resolve pywin32 on other
# platforms, which was a source of confusing resolver errors.
dependencies = [
    "Pillow>=8.3.2",
    "pywin32>=302; sys_platform == 'win32'",
]

[project.scripts]
# The locator tool, in the package rather than in tools/, because the wheel contains
# only `pyjab` -- a script under tools/ ships in the sdist and never arrives with
# `pip install pyjab`. Issue #75 is "cannot find a control", and the answer has to be
# available to someone who installed from PyPI and nothing else.
pyjab-inspect = "pyjab.inspector:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.1",
    # tools/check_license_consistency.py reads pyproject.toml, and the
    # standard library only gained tomllib in 3.11.
    "tomli>=2.0.1; python_version < '3.11'",
    # tests/test_changelog_immutable.py parses the workflow files. A step added to
    # ci.yml at the wrong indentation made every run finish as a failure with zero
    # jobs and no logs, which reads like infrastructure rather than a syntax error
    # in the file that was just edited. With PyYAML missing the test skips, and a
    # guard that skips is not a guard -- the same reason check_dco.py is worth
    # having even though it cannot run in CI.
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/gaozhao1989/pyjab"
Repository = "https://github.com/gaozhao1989/pyjab"
Issues = "https://github.com/gaozhao1989/pyjab/issues"
Changelog = "https://github.com/gaozhao1989/pyjab/blob/master/CHANGELOG.rst"

[tool.setuptools.dynamic]
version = { attr = "pyjab.__version__" }

# Be explicit.  Stale build/ and dist/ directories can contain a copy of the
# package (build/lib/pyjab/...), and a bare find_packages() would happily pick
# those up and ship duplicated modules.
[tool.setuptools.packages.find]
include = ["pyjab*"]
exclude = ["build*", "dist*", "docs*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The four files that drive a live Java application set this. It was used and never
# registered, so pytest warned about it on every run and `-m gui` selected nothing
# reliably. Registering it is what makes `-m "gui"` a usable way to run just the tests
# that need a desktop -- which matters more now that windows-gui.yml can run them.
markers = [
    "gui: needs a live Java application and a desktop; not collected by default",
]
# A hung Java Access Bridge call is the one failure the portable suite cannot see
# and CI cannot catch: the GUI suite runs on a developer's Windows machine, and
# without this a hang costs however long it takes someone to notice and then says
# nothing about where.  faulthandler is built in, so this needs no dependency; on
# the timeout it prints every thread's stack -- which names the pyjab call that
# never returned -- and gives up.
#
# Generous, because a GUI test legitimately waits for a JVM: JABDriver(timeout=30)
# plus a few bounded waits fits well inside it.
faulthandler_timeout = 300
