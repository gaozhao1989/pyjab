name: Probe Windows GUI

# TEMPORARY PROBE -- not part of the build, and asserts nothing about pyjab.
#
# Question it answers: can a GitHub-hosted windows-latest runner host an
# interactive desktop session, so that Java Access Bridge can see a Swing
# window and pyjab can attach to it?
#
# Why it matters: the repository is public, so standard-runner minutes are free
# and unmetered. If the answer is yes, we get a cloud Windows test machine with
# no account, no VM to pay for and no manual copy-paste of results -- which is
# the whole reason this exists.
#
# Every step is diagnostic and none of them fail the job, so a single run
# reports the full picture. Delete this file and the branch once the answer is
# written down.

on:
  push:
    branches:
      - probe/windows-gui
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ---------------------------------------------------------------------
      # 1. Where is this process actually running?  A service in session 0 has
      #    no interactive desktop; a process in session 1 owned by a logged-on
      #    user does.  This is the discriminator for everything below.
      # ---------------------------------------------------------------------
      - name: Where are we running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "== identity =="
          Write-Host "user        : $(whoami)"
          Write-Host "pid         : $PID"
          Write-Host "our session : $((Get-Process -Id $PID).SessionId)"
          Write-Host "JAVA_HOME   : $env:JAVA_HOME"
          Write-Host ""
          Write-Host "== logon sessions (qwinsta) =="
          qwinsta 2>&1
          Write-Host ""
          Write-Host "== logged-on users (query user) =="
          query user 2>&1
          Write-Host ""
          Write-Host "== explorer.exe: an interactive shell only exists in a real session =="
          Get-Process explorer -ErrorAction SilentlyContinue |
            Format-Table Id, SessionId, MainWindowTitle -AutoSize
          Write-Host "== JAB DLLs shipped by this JDK =="
          Get-ChildItem -Path $env:JAVA_HOME -Recurse -Filter "WindowsAccessBridge-*.dll" |
            Select-Object -ExpandProperty FullName
          exit 0

      # ---------------------------------------------------------------------
      # 2. The bridge has to be enabled before any JVM starts, because it is
      #    ~/.accessibility.properties that makes the *target* JVM load it.
      # ---------------------------------------------------------------------
      - name: Enable Java Access Bridge before any JVM starts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -c "from pyjab.common.service import Service; Service().init_bridge(); print('init_bridge ok')"
          Write-Host "== ~/.accessibility.properties =="
          Get-Content "$env:USERPROFILE\.accessibility.properties" -ErrorAction SilentlyContinue
          exit 0

      - name: Build the test application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          javac -d tests/java/classes tests/java/PyjabTestApp.java
          Write-Host "javac exit: $LASTEXITCODE"
          Get-ChildItem tests/java/classes | Select-Object -ExpandProperty Name
          exit 0

      # ---------------------------------------------------------------------
      # 3. The decisive step.  Launch the app, then ask three different
      #    observers whether a window exists, so a "no" can be attributed:
      #      * the OS process table (MainWindowTitle -- same-session only)
      #      * EnumWindows on our own desktop, via pywin32
      #      * pyjab, through Java Access Bridge
      # ---------------------------------------------------------------------
      - name: Launch it and ask three observers whether it has a window
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $p = Start-Process java -PassThru -ArgumentList '-cp','tests/java/classes','PyjabTestApp','--title=PyjabTestApp'
          Write-Host "launched: pid=$($p.Id) session=$($p.SessionId)"
          Start-Sleep -Seconds 20

          Write-Host ""
          Write-Host "== observer 1: the OS process table =="
          Get-Process java -ErrorAction SilentlyContinue |
            Format-Table Id, SessionId, MainWindowHandle, MainWindowTitle -AutoSize
          Write-Host "java still alive: $([bool](Get-Process -Id $p.Id -ErrorAction SilentlyContinue))"

          Write-Host ""
          Write-Host "== observer 2: EnumWindows on our own desktop (pywin32) =="
          # One line on purpose: a PowerShell here-string needs its '@ on a line
          # of its own at column 0, which ends an indented YAML block scalar.
          # The callback must return True -- pywin32 stops enumerating on a
          # falsy return, so a lambda that only appends would report "this
          # desktop has one window", and that misreads as a finding.
          python -c "import win32gui; ws=[]; win32gui.EnumWindows(lambda h, e: ws.append((h, win32gui.GetWindowText(h))) or True, None); t=[x for _, x in ws if x]; print('top-level windows on this desktop:', len(ws)); print('titled:', t[:50]); print('PyjabTestApp present:', any('PyjabTestApp' in x for x in t))"
          Write-Host "enumwindows exit: $LASTEXITCODE"

          Write-Host ""
          Write-Host "== observer 3: pyjab, through Java Access Bridge =="
          pyjab-inspect windows
          Write-Host "pyjab-inspect exit: $LASTEXITCODE"

          Write-Host ""
          Write-Host "== is the bridge enabled in the registry? =="
          reg query "HKLM\SOFTWARE\JavaSoft\Java Access Bridge" 2>&1
          reg query "HKLM\SOFTWARE\WOW6432Node\JavaSoft\Java Access Bridge" 2>&1
          Write-Host "== are the JAB dlls in System32? =="
          Get-ChildItem "$env:WINDIR\System32\WindowsAccessBridge-*.dll" -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName
          exit 0
