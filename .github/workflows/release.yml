name: Release

# Triggered by pushing a version tag, e.g.
#
#     git tag -a v1.2.0 -m "pyjab 1.2.0"
#     git push origin v1.2.0
#
# Before the first run, configure PyPI Trusted Publishing (no API token needed):
#
#   1. https://pypi.org/manage/account/publishing/  -> "Add a new pending publisher"
#   2. Project name:  pyjab
#      Owner:         gaozhao1989
#      Repository:    pyjab
#      Workflow name: release.yml
#      Environment:   pypi
#   3. In this repository: Settings -> Environments -> create an environment
#      named "pypi".
#
# If you would rather use an API token, delete the `id-token: write` permission
# and the `environment:` key below, and pass `password: ${{ secrets.PYPI_API_TOKEN }}`
# to the publish step instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify the tag matches pyjab.__version__
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('pyjab/__init__.py').read_text()).group(1))")
          echo "tag=$tag  __version__=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match pyjab.__version__ ($version)"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Run the portable test suite
        run: |
          # Install from pyproject.toml, exactly as ci.yml does. Listing the
          # test dependencies by hand here is what let ci.yml and release.yml
          # drift, and a release then failed at this step for a missing Pillow
          # after the tag had already been pushed.
          python -m pip install ".[dev]"
          python -m pytest tests/ -v

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
