name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The portable test suite.  It covers DLL discovery and touches nothing
  # Windows specific, so it is worth running on every OS and several Python
  # versions -- it is fast and it catches platform assumptions early.
  # ---------------------------------------------------------------------------
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The cross-platform sweep covers the middle of the supported range.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        # The rest of the range the classifiers claim (3.10 through 3.13) is
        # covered here on Linux rather than left untested.
        #
        # 3.8 is NOT tested, and the reason is worth recording: pyproject.toml's
        # build-system requires setuptools>=77 for PEP 639 licence expressions,
        # and setuptools stopped supporting 3.8 after 75.3.4. So `pip install
        # pyjab` works on 3.8 (the wheel needs no build backend) but building
        # from the sdist cannot work there. requires-python still says ">=3.8",
        # which is therefore only true for wheel installs.
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test tooling
        run: |
          python -m pip install --upgrade pip
          # Install from pyproject.toml rather than listing packages here, so the
          # test environment cannot drift from what the package declares. This
          # is also what pull requests are checked against.
          python -m pip install ".[dev]"

      - name: Run portable test suite
        run: python -m pytest tests/ -v

  # ---------------------------------------------------------------------------
  # Verify DLL discovery against many real JDK layouts.  This is the regression
  # test for the "WindowsAccessBridge dll not found on JDK 11+" bug: JDK 8 uses
  # %JAVA_HOME%\jre\bin, JDK 11+ uses %JAVA_HOME%\bin.
  #
  # Note this job deliberately does NOT install pywin32.  pyjab.config has no
  # Windows-only imports, so discovery can be exercised on its own.
  # ---------------------------------------------------------------------------
  jab-dll-discovery:
    name: JAB DLL discovery (JDK ${{ matrix.java }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11", "17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Report where the DLL actually is
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME = $env:JAVA_HOME"
          Get-ChildItem -Path $env:JAVA_HOME -Recurse -Filter "WindowsAccessBridge-*.dll" `
            -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: Discovery must resolve the DLL
        shell: pwsh
        run: |
          python -c "from pyjab.config import find_bridge_dll; p = find_bridge_dll(); print('found:', p); assert p is not None, 'pyjab did not find the JAB DLL'"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: The DLL must actually load
        shell: pwsh
        run: |
          # Finding the path is not the same as loading it. This exercises
          # ctypes.CDLL on the discovered file, which also proves that any
          # dependent DLLs resolve from that directory.
          python -c "from pyjab.common.service import Service; lib = Service().load_library(); print('loaded:', lib)"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Run discovery tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_bridge_dll_discovery.py -v

  # ---------------------------------------------------------------------------
  # The real import path on Windows: pywin32 present, pyjab.jabdriver importable.
  # ---------------------------------------------------------------------------
  windows-import-smoke:
    name: Windows import smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Import pyjab and pyjab.jabdriver
        run: |
          python -c "import pyjab; print('pyjab', pyjab.__version__)"
          python -c "import pyjab.jabdriver; print('pyjab.jabdriver OK')"
          python -c "from pyjab.config import find_bridge_dll; print('DLL:', find_bridge_dll())"

      - name: Message pump runs against the real pythoncom
        shell: pwsh
        run: |
          # The portable suite stubs pywin32, so it cannot prove that the real
          # pythoncom.PumpWaitingMessages() call works or that pythoncom.com_error
          # is the right exception to catch. This does, with pywin32 installed.
          python -c "from pyjab.common.win32utils import Win32Utils; w = Win32Utils.__wrapped__(); print('pumped:', w.pump_messages()); w.pump_messages(); print('repeat call OK')"

      - name: Compile the Swing application the GUI tests drive
        shell: pwsh
        run: |
          # The GUI suite cannot run on a runner (no interactive desktop), but
          # its application can at least be proved to compile. This is the only
          # automated check on tests/java/PyjabTestApp.java, so it runs with
          # warnings enabled and fails on any of them.
          javac -Xlint:all -d tests/java/classes tests/java/PyjabTestApp.java
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $classes = Get-ChildItem tests/java/classes -Filter *.class
          Write-Host "compiled $($classes.Count) class files"
          if ($classes.Count -lt 2) { throw "javac produced almost nothing" }

          # And the fixture must be able to find the JDK the same way the tests
          # will, rather than only working when javac happens to be on the PATH.
          python -c "from tests.conftest import find_java_tool, needs_compiling; print('javac:', find_java_tool('javac')); print('java:', find_java_tool('java')); print('needs compiling:', needs_compiling())"
          python -c "from tests.conftest import TEST_APP_TITLE, TEST_APP_CLASS; print('app:', TEST_APP_CLASS, '/', TEST_APP_TITLE)"

  # ---------------------------------------------------------------------------
  # Build the distributions and validate the metadata, so a broken release is
  # caught on the PR rather than at tag time.
  # ---------------------------------------------------------------------------
  package:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Fail if a stale package copy was packaged
        run: |
          python - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              print(f"::error::expected exactly one wheel, found {wheels}")
              sys.exit(1)

          names = zipfile.ZipFile(wheels[0]).namelist()
          # A stale build/lib/ or dist/ copy inside the wheel means
          # tool.setuptools.packages.find is picking up artefacts.
          bad = [n for n in names if n.startswith(("build/", "dist/")) or "egg-info" in n]
          if bad:
              print(f"::error::wheel contains stale entries: {bad}")
              sys.exit(1)

          print(f"{wheels[0]} is clean ({len(names)} entries)")
          PY

      - name: Check the sdist carries the GUI test application
        run: |
          # The Swing application in tests/java is what the GUI suite drives, and
          # MANIFEST.in is the only thing that puts it in the sdist. A stale
          # compiled copy must not ship either.
          python - <<'PY'
          import glob
          import sys
          import tarfile

          sdists = glob.glob("dist/*.tar.gz")
          if len(sdists) != 1:
              print(f"::error::expected exactly one sdist, found {sdists}")
              sys.exit(1)

          names = tarfile.open(sdists[0]).getnames()
          wanted = [n for n in names if n.endswith("tests/java/PyjabTestApp.java")]
          if not wanted:
              print("::error::the sdist is missing tests/java/PyjabTestApp.java")
              print("  java sources present:", [n for n in names if n.endswith(".java")])
              sys.exit(1)

          stale = [n for n in names if "/tests/java/classes/" in n]
          if stale:
              print(f"::error::the sdist ships compiled classes: {stale[:5]}")
              sys.exit(1)

          print(f"{sdists[0]} carries {wanted[0]}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
